name: Dependabot Auto-Merge

# This repo delegates Dependabot auto-merge policy to the shared org reusable workflow.
# See plures/.github/.github/workflows/dependabot-auto-merge.yml for the full policy.
# Note: keep workflow `permissions` here (caller permissions cap the reusable workflow's GITHUB_TOKEN).
# Do not fork/duplicate the policy body here - update the shared template instead.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: plures/.github/.github/workflows/dependabot-auto-merge.yml@main
    secrets: inherit
